<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Местная Библиотека</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Навигационная панель -->
  <header class="navbar">
    <div class="logo" onclick="showScreen('library-view')">📚 Книжная Полка</div>
    <div class="nav-actions">
      <input type="text" id="search-input" placeholder="Поиск по названию или автору...">
      <button class="btn btn-primary" onclick="showScreen('add-book-view')">➕ Добавить книгу</button>
    </div>
  </header>

  <main class="content">
    
    <!-- ЭКРАН 1: ГЛАВНАЯ ВИТРИНА КНИГ -->
    <section id="library-view" class="screen active">
      <h2>Мои Книги</h2>
      <div id="books-grid" class="books-grid">
        <!-- Карточки книг вставляются через JS -->
      </div>
    </section>

    <!-- ЭКРАН 2: ДОБАВЛЕНИЕ И ПАРСИНГ КНИГИ -->
    <section id="add-book-view" class="screen">
      <div class="card form-card">
        <h2>Добавить новую книгу</h2>
        <div class="search-bar">
          <input type="text" id="isbn-search" placeholder="Введите ISBN для парсинга...">
          <button class="btn btn-secondary" onclick="parseBookByIsbn()">Найти на Буквоеде</button>
        </div>
        <div id="parse-loader" class="loader hidden">Ищем книгу и загружаем данные...</div>

        <!-- Форма добавления (заполняется автоматически после парсинга или вручную) -->
        <form id="book-form" onsubmit="submitBook(event)" class="book-form hidden">
          <div class="form-group">
            <label>ISBN</label>
            <input type="text" id="form-isbn" required>
          </div>
          <div class="form-group">
            <label>Название</label>
            <input type="text" id="form-title" required>
          </div>
          <div class="form-group">
            <label>Автор</label>
            <input type="text" id="form-author" required>
          </div>
          <div class="form-group">
            <label>Статус</label>
            <select id="form-status">
              <option value="Хочу прочитать">Хочу прочитать</option>
              <option value="Читаю">Читаю</option>
              <option value="Прочитано">Прочитано</option>
            </select>
          </div>
          <div class="form-group">
            <label>Издательство</label>
            <input type="text" id="form-publisher">
          </div>
          <div class="form-group">
            <label>Серия</label>
            <input type="text" id="form-series">
          </div>
          <div class="form-group">
            <label>Переплет</label>
            <input type="text" id="form-binding">
          </div>
          <div class="form-group">
            <label>Кол-во страниц</label>
            <input type="text" id="form-pages">
          </div>
          <div class="form-group">
            <label>Раздел</label>
            <input type="text" id="form-section">
          </div>
          <div class="form-group">
            <label>Ссылка или путь к обложке</label>
            <input type="text" id="form-cover" required>
          </div>
          <button type="submit" class="btn btn-success btn-block">Сохранить книгу в базу</button>
        </form>
      </div>
    </section>

  </main>

  <!-- МОДАЛЬНОЕ ОКНО: ДЕТАЛЬНЫЙ ПРОСМОТР КНИГИ -->
  <div id="book-modal" class="modal">
    <div class="modal-content">
      <span class="close-button" onclick="closeModal()">&times;</span>
      <div class="modal-body" id="modal-book-details">
        <!-- Детали книги через JS -->
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
